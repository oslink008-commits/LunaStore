name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Android SDK
        run: |
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip
          unzip -q commandlinetools-linux-9477386_latest.zip
          rm -rf $HOME/android
          mkdir -p $HOME/android/cmdline-tools
          mv cmdline-tools $HOME/android/cmdline-tools/latest
          echo "ANDROID_HOME=$HOME/android" >> $GITHUB_ENV
          echo "$HOME/android/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$HOME/android/platform-tools" >> $GITHUB_PATH

      - name: Accept licenses and install components
        run: |
          $HOME/android/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $HOME/android/cmdline-tools/latest/bin/sdkmanager "platform-tools"
          $HOME/android/cmdline-tools/latest/bin/sdkmanager "platforms;android-34"
          $HOME/android/cmdline-tools/latest/bin/sdkmanager "build-tools;34.0.0"

      - name: Create local.properties
        run: echo "sdk.dir=$HOME/android" > local.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build APK Release
        run: ./gradlew assembleRelease --stacktrace --info

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LunaStore-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
