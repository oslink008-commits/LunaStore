name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Android SDK
        run: |
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip
          unzip -q commandlinetools-linux-9477386_latest.zip
          mkdir -p $HOME/android/cmdline-tools/latest
          mv cmdline-tools $HOME/android/cmdline-tools/latest
          echo "ANDROID_HOME=$HOME/android" >> $GITHUB_ENV
          echo "$HOME/android/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$HOME/android/platform-tools" >> $GITHUB_PATH
          echo "$HOME/android/build-tools/34.0.0" >> $GITHUB_PATH

      - name: Accept Android SDK licenses
        run: |
          export PATH=$HOME/android/cmdline-tools/latest/bin:$PATH
          yes | sdkmanager --licenses || true

      - name: Install Android SDK components
        run: |
          export PATH=$HOME/android/cmdline-tools/latest/bin:$PATH
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-34"
          sdkmanager "build-tools;34.0.0"

      - name: Create local.properties
        run: echo "sdk.dir=$HOME/android" > local.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build APK Release
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LunaStore-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
